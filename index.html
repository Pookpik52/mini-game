<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multiplication Rush</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e1b4b 0%, #09090b 45%, #050505 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 20%, rgba(168,85,247,0.15), transparent 25%),
        radial-gradient(circle at 80% 30%, rgba(59,130,246,0.12), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(236,72,153,0.12), transparent 25%);
      pointer-events: none;
      animation: glowMove 10s linear infinite alternate;
    }

    @keyframes glowMove {
      from {
        transform: translateY(0px) scale(1);
      }
      to {
        transform: translateY(-20px) scale(1.05);
      }
    }

    .container {
      width: 100%;
      max-width: 920px;
      background: rgba(10,10,15,0.75);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border-radius: 35px;
      padding: 35px;
      box-shadow:
        0 0 60px rgba(139,92,246,0.18),
        0 0 120px rgba(59,130,246,0.08);
      position: relative;
      overflow: hidden;
    }

    .container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,0.04),
        transparent,
        rgba(255,255,255,0.02)
      );
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 58px;
      font-weight: 900;
      letter-spacing: -3px;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ffffff, #a855f7, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(168,85,247,0.3);
    }

    .subtitle {
      text-align: center;
      color: #b4b4b8;
      margin-bottom: 35px;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .table-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 16px;
    }

    .table-btn {
      position: relative;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 28px 10px;
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      color: white;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
      overflow: hidden;
    }

    .table-btn::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, #8b5cf6, #3b82f6, #ec4899);
      opacity: 0;
      z-index: -1;
      transition: 0.25s;
    }

    .table-btn:hover::before {
      opacity: 1;
    }

    .table-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow:
        0 0 25px rgba(168,85,247,0.4),
        0 0 50px rgba(59,130,246,0.2);
    }

    .hidden {
      display: none;
    }

    .game-info {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .info-box {
      flex: 1;
      min-width: 150px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      padding: 22px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 0 20px rgba(255,255,255,0.02);
    }

    .info-box p {
      color: #b4b4b8;
      margin-bottom: 6px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-box h2 {
      font-size: 34px;
      font-weight: 900;
    }

    .question-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 35px;
      padding: 70px 30px;
      text-align: center;
      margin-bottom: 28px;
      backdrop-filter: blur(14px);
      position: relative;
      overflow: hidden;
    }

    .question-box::before {
      content: '';
      position: absolute;
      width: 250px;
      height: 250px;
      background: rgba(168,85,247,0.15);
      filter: blur(80px);
      top: -100px;
      right: -50px;
    }

    .question-box h2 {
      font-size: 84px;
      font-weight: 900;
      position: relative;
      z-index: 1;
    }

    .answers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .answer-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      color: white;
      border-radius: 24px;
      padding: 28px;
      font-size: 38px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    .answer-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), transparent);
      opacity: 0;
      transition: 0.2s;
    }

    .answer-btn:hover::before {
      opacity: 1;
    }

    .answer-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow:
        0 0 20px rgba(168,85,247,0.25),
        0 0 40px rgba(59,130,246,0.12);
    }

    .correct {
      background: rgba(34,197,94,0.18) !important;
      border-color: #4ade80 !important;
      box-shadow: 0 0 25px rgba(34,197,94,0.45) !important;
    }

    .wrong {
      background: rgba(239,68,68,0.18) !important;
      border-color: #f87171 !important;
      box-shadow: 0 0 25px rgba(239,68,68,0.4) !important;
    }

    .game-over {
      text-align: center;
    }

    .game-over h2 {
      font-size: 70px;
      font-weight: 900;
      margin-bottom: 15px;
    }

    .final-score {
      font-size: 100px;
      font-weight: 900;
      margin: 25px 0;
      background: linear-gradient(90deg, #fff, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .restart-btn {
      background: linear-gradient(135deg, #8b5cf6, #3b82f6);
      color: white;
      border: none;
      border-radius: 20px;
      padding: 18px 32px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.25s;
      box-shadow: 0 0 25px rgba(139,92,246,0.35);
    }

    .restart-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 0 40px rgba(139,92,246,0.5);
    }

    @media (max-width: 768px) {
      .container {
        padding: 22px;
        border-radius: 28px;
      }

      h1 {
        font-size: 40px;
      }

      .table-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .question-box {
        padding: 40px 20px;
      }

      .question-box h2 {
        font-size: 54px;
      }

      .answers-grid {
        grid-template-columns: 1fr;
      }

      .answer-btn {
        font-size: 30px;
      }

      .game-info {
        flex-direction: column;
      }

      .final-score {
        font-size: 70px;
      }

      .restart-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <div id="menu-screen">
      <h1>Multiplication Rush</h1>
      <p class="subtitle">เลือกแม่สูตรคูณที่ต้องการเล่น</p>

      <div class="table-grid">
        <button class="table-btn" onclick="startGame(2)">แม่ 2</button>
        <button class="table-btn" onclick="startGame(3)">แม่ 3</button>
        <button class="table-btn" onclick="startGame(4)">แม่ 4</button>
        <button class="table-btn" onclick="startGame(5)">แม่ 5</button>
        <button class="table-btn" onclick="startGame(6)">แม่ 6</button>
        <button class="table-btn" onclick="startGame(7)">แม่ 7</button>
        <button class="table-btn" onclick="startGame(8)">แม่ 8</button>
        <button class="table-btn" onclick="startGame(9)">แม่ 9</button>
        <button class="table-btn" onclick="startGame(10)">แม่ 10</button>
        <button class="table-btn" onclick="startGame(11)">แม่ 11</button>
        <button class="table-btn" onclick="startGame(12)">แม่ 12</button>
      </div>
    </div>

    <div id="game-screen" class="hidden">
      <div class="game-info">
        <div class="info-box">
          <p>แม่สูตรคูณ</p>
          <h2 id="table-name">2</h2>
        </div>

        <div class="info-box">
          <p>คะแนน</p>
          <h2 id="score">0</h2>
        </div>

        <div class="info-box">
          <p>เวลา</p>
          <h2 id="timer">10</h2>
        </div>
      </div>

      <div class="question-box">
        <h2 id="question">2 × 1</h2>
      </div>

      <div class="answers-grid" id="answers"></div>
    </div>

    <div id="game-over-screen" class="hidden game-over">
      <h2>Game Over</h2>
      <p>คะแนนของคุณ</p>
      <div class="final-score" id="final-score">0</div>

      <button class="restart-btn" onclick="backToMenu()">
        กลับหน้าเลือกแม่สูตรคูณ
      </button>
    </div>

  </div>

  <script>
    let selectedTable = 2
    let currentAnswer = 0
    let score = 0
    let timeLeft = 5
    let timer

    function startGame(table) {
      selectedTable = table
      score = 0

      document.getElementById('menu-screen').classList.add('hidden')
      document.getElementById('game-screen').classList.remove('hidden')
      document.getElementById('game-over-screen').classList.add('hidden')

      document.getElementById('table-name').textContent = table
      document.getElementById('score').textContent = score

      generateQuestion()
    }

    function generateQuestion() {
      clearInterval(timer)

      const a = selectedTable
      const b = random(1, 12)

      currentAnswer = a * b

      document.getElementById('question').textContent = `${a} × ${b}`

      const choices = [currentAnswer]

      while (choices.length < 4) {
        const fake = currentAnswer + random(-10, 10)

        if (fake > 0 && !choices.includes(fake)) {
          choices.push(fake)
        }
      }

      choices.sort(() => Math.random() - 0.5)

      const answersContainer = document.getElementById('answers')
      answersContainer.innerHTML = ''

      choices.forEach(choice => {
        const button = document.createElement('button')
        button.className = 'answer-btn'
        button.textContent = choice

        button.onclick = () => checkAnswer(choice, button)

        answersContainer.appendChild(button)
      })

      timeLeft = 5
      document.getElementById('timer').textContent = timeLeft

      timer = setInterval(() => {
        timeLeft--

        document.getElementById('timer').textContent = timeLeft

        if (timeLeft <= 0) {
          clearInterval(timer)
          endGame()
        }
      }, 1000)
    }

    function checkAnswer(choice, buttonElement) {
      const allButtons = document.querySelectorAll('.answer-btn')

      allButtons.forEach(btn => {
        btn.disabled = true
      })

      if (choice === currentAnswer) {
        score++
        timeLeft += 3

        buttonElement.classList.add('correct')
      } else {
        score = Math.max(0, score - 1)

        buttonElement.classList.add('wrong')

        allButtons.forEach(btn => {
          if (Number(btn.textContent) === currentAnswer) {
            btn.classList.add('correct')
          }
        })
      }

      document.getElementById('score').textContent = score
      document.getElementById('timer').textContent = timeLeft

      setTimeout(() => {
        generateQuestion()
      }, 700)
    }

    function endGame() {
      document.getElementById('game-screen').classList.add('hidden')
      document.getElementById('game-over-screen').classList.remove('hidden')

      document.getElementById('final-score').textContent = score
    }

    function backToMenu() {
      clearInterval(timer)

      document.getElementById('game-screen').classList.add('hidden')
      document.getElementById('game-over-screen').classList.add('hidden')
      document.getElementById('menu-screen').classList.remove('hidden')
    }

    function random(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min
    }
  </script>

</body>
</html>
